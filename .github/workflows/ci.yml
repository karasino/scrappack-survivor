name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rules:
    name: Core, harness and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Environment versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Check docs
        run: npm run check:docs
      - name: Core tests
        run: npm run test:core
      - name: Harness tests
        run: npm run test:harness
      - name: Build
        run: npm run build

  browser:
    name: Browser UI (WebGL and Canvas)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Update using the official CfT availability dashboard; see docs/verification.md.
      CHROME_VERSION: '157.0.8103.78'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Environment versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Install Chrome libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl unzip fonts-liberation \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libexpat1 libgbm1 libglib2.0-0t64 \
            libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 \
            libudev1 libvulkan1 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 \
            libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Install Chrome for Testing
        timeout-minutes: 5
        run: |
          curl --fail --show-error --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" \
            --output "$RUNNER_TEMP/chrome-linux64.zip"
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          chrome_bin="$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome"
          "$chrome_bin" --version | tee "$RUNNER_TEMP/chrome-version.txt"
          grep -F " ${CHROME_VERSION}" "$RUNNER_TEMP/chrome-version.txt"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
      - name: Doctor
        run: npm run doctor
      - name: Reproducible scenarios
        timeout-minutes: 5
        run: npm run test:scenarios
      - name: Combat UI
        timeout-minutes: 5
        run: npm run test:combat-ui
      - name: Exploration UI
        timeout-minutes: 5
        run: npm run test:exploration
      - name: Crafting UI
        timeout-minutes: 5
        run: npm run test:crafting
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
